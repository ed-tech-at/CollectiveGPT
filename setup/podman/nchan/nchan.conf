server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # --- Publisher (nur serverseitig durch PHP) ----------------------------
    # PHP ruft /pub_id/?password=...&id=<channel> auf (siehe
    # php/gpt2024/gpt_functions.php::sendWsPost). Das Passwort MUSS mit
    # $nchan_pw in CollectiveGPT/php/pws.php uebereinstimmen.
    location ~ /pub_id/ {
        if ($arg_password != "CHANGE_ME_nchan_pw") {
             return 403 "Forbidden";
        }
        nchan_publisher;
        nchan_channel_id $arg_id;
    }

    # --- Subscriber (Browser per WebSocket) --------------------------------
    # Browser abonnieren /sub_id/?id=<channel> (z.B. gpt2024a, gpt2024p).
    location ~ /sub_id/ {
        nchan_subscriber;
        nchan_channel_id $arg_id;
        nchan_subscriber_first_message newest;
    }

    location /nchan_stub_status {
        nchan_stub_status;
    }

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 401;
    }
}
