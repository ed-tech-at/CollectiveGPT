# ed-tech.app -- CollectiveGPT
# Der gesamte Repo-Baum ist Docroot; index.php uebernimmt das Routing
# (try_files ... /index.php?path=$uri&$args -- vgl. bisherige ISPConfig-Config).
server {
    listen 80;
    server_name ed-tech.app;

    root /var/www/html;
    index index.php;

    client_max_body_size 256M;

    include snippets/security.conf;
    include snippets/cache.conf;

    # --- nchan: Pub/Sub same-origin ----------------------------------------
    # PHP publiziert serverseitig ueber /pub_id/, der Browser abonniert per
    # WebSocket ueber /sub_id/. Beides wird intern an den nchan-Container
    # weitergereicht.
    location ~ ^/(pub_id|sub_id|nchan_stub_status) {
        proxy_pass http://nchan:80;
        proxy_http_version 1.1;

        # WebSocket-Upgrade (wss -> ws intern)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived Subscriber-Verbindungen nicht abschneiden.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        tcp_nodelay on;
    }

    # --- App-Routing --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?path=$uri&$args;
    }

    location ~ \.php$ {
        include snippets/php.conf;
        fastcgi_pass edtech-php:9000;
    }
}
