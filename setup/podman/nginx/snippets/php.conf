# PHP-FPM fuer CollectiveGPT. Docroot (/var/www/html) ist zugleich der an
# PHP-FPM gemountete App-Baum, daher kann SCRIPT_FILENAME auf $document_root
# basieren (Standard-Setup, kein public/-Split).
try_files $uri =404;

include fastcgi_params;
fastcgi_index index.php;

fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
fastcgi_param PATH_INFO $fastcgi_path_info;

# Hinter Traefik: korrektes Schema/Host an PHP durchreichen.
fastcgi_param HTTPS $https if_not_empty;
fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;

fastcgi_read_timeout 300;
