# Sicherheitsheader
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

server_tokens off;

# Versteckte Dateien (ausser .well-known)
location ~ /\.(?!well-known) {
    deny all;
}

# pws.php enthaelt Zugangsdaten -- als Quelltext liegt sie in php/, wird von
# PHP aber ohnehin nur inkludiert (gibt nichts aus). Direktaufruf sperren.
location ~* /pws\.php$ {
    deny all;
}

# Sensible Dateiendungen nie ausliefern.
# Hinweis: .json ist NICHT gesperrt -- das Frontend laedt /chart-config.json.
location ~* \.(env|ini|conf|log|sql|bak|old|orig|dist|lock|md|coffee)$ {
    deny all;
}

# optionen.json ist interne Konfiguration und wird nur serverseitig gelesen.
location = /optionen.json {
    deny all;
}
