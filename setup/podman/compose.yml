services:
  # --------------------------------------------------------------------------
  # ed-tech.app -- Nginx (Web-Einstiegspunkt, hinter Traefik)
  # Liefert die statischen Dateien der CollectiveGPT-App aus, reicht *.php an
  # PHP-FPM weiter und proxyt /pub_id/, /sub_id/, /nchan_stub_status an nchan.
  # --------------------------------------------------------------------------
  edtech-nginx:
    image: nginx:alpine
    container_name: edtech-nginx
    restart: unless-stopped
    depends_on:
      - edtech-php
      - nchan
    volumes:
      # App-Docroot (nur lesend fuer Nginx: liefert statische Assets aus)
      - ./CollectiveGPT:/var/www/html:ro
      - ./nginx/00-upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
      - ./nginx/edtech.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    networks:
      - traefik_net
      - edtech_net
    labels:
      - traefik.enable=true

      # ed-tech.app  HTTP -> HTTPS
      - traefik.http.routers.edtech-http.rule=Host(`ed-tech.app`)
      - traefik.http.routers.edtech-http.entrypoints=web
      - traefik.http.routers.edtech-http.middlewares=redirect-to-https@file

      # ed-tech.app  HTTPS / WSS
      - traefik.http.routers.edtech-https.rule=Host(`ed-tech.app`)
      - traefik.http.routers.edtech-https.entrypoints=websecure
      - traefik.http.routers.edtech-https.tls=true
      - traefik.http.routers.edtech-https.tls.certresolver=myresolver

      - traefik.http.services.edtech.loadbalancer.server.port=80
      - traefik.docker.network=traefik_net

  # --------------------------------------------------------------------------
  # ed-tech.app -- PHP-FPM (CollectiveGPT)
  # Der komplette Repo-Baum ist Docroot (index.php liegt in der Wurzel).
  # --------------------------------------------------------------------------
  edtech-php:
    build:
      context: .
      dockerfile: Dockerfile.php
    image: edtech-php:8.5
    container_name: edtech-php
    restart: unless-stopped
    volumes:
      - ./CollectiveGPT:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - edtech_net
      # MariaDB: die DB-Verbindung (PDO) laeuft ueber dieses externe Netz.
      # $db_host in CollectiveGPT/php/pws.php = Name des MariaDB-Containers.
      - mariadb_net

  # --------------------------------------------------------------------------
  # nchan -- WebSocket-/Pub-Sub-Server (nur intern, kein eigener Traefik-Host)
  # Erreichbar same-origin ueber edtech-nginx unter /pub_id/ und /sub_id/.
  # --------------------------------------------------------------------------
  nchan:
    build:
      context: ./nchan
      dockerfile: Dockerfile
    image: local/nchan:1.3.8-alpine
    container_name: nchan
    restart: unless-stopped
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./nchan/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nchan/nchan.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edtech_net

networks:
  # Von Traefik bereitgestelltes externes Netz (muss existieren).
  traefik_net:
    external: true

  # Externes MariaDB-Netz (muss existieren, falls die DB genutzt wird).
  mariadb_net:
    external: true

  # Internes Netz: nginx <-> php <-> nchan.
  edtech_net:
    driver: bridge
