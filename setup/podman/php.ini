; CollectiveGPT laeuft aus dem gesamten Repo-Baum; optionen.json und
; chart-config.json werden serverseitig nach /var/www/html geschrieben.
open_basedir=/var/www/html:/tmp
upload_tmp_dir=/tmp
sys_temp_dir=/tmp

expose_php=Off
disable_functions=exec,passthru,shell_exec,system,proc_open,popen
file_uploads=On
upload_max_filesize=256M
post_max_size=256M
memory_limit=512M
max_execution_time=300

; PHP publiziert per file_get_contents an https://ed-tech.app/pub_id/ (nchan).
allow_url_fopen=On
